<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .patra-line { fill: none; stroke: #006b55; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .patra-fill { fill: #006b55; }
      .patra-dot { fill: #006b55; }
    </style>
  </defs>

  <!-- Central Padma / Lotus Rosette -->
  <g transform="translate(80, 80)">
    <!-- Core seed -->
    <circle cx="0" cy="0" r="3.5" class="patra-fill" />
    <circle cx="0" cy="0" r="7" class="patra-line" stroke-dasharray="1.5 2" />

    <!-- 8 Petals (Padma Sari) -->
    <path d="M 0 -7 C -4 -13, -3 -20, 0 -24 C 3 -20, 4 -13, 0 -7 Z" class="patra-line" />
    <path d="M 0 7 C -4 13, -3 20, 0 24 C 3 20, 4 13, 0 7 Z" class="patra-line" />
    <path d="M -7 0 C -13 -4, -20 -3, -24 0 C -20 3, -13 4, -7 0 Z" class="patra-line" />
    <path d="M 7 0 C 13 -4, 20 -3, 24 0 C 20 3, 13 4, 7 0 Z" class="patra-line" />

    <!-- Diagonal Petals -->
    <path d="M -5 -5 C -11 -11, -16 -16, -17 -17 C -16 -16, -11 -11, -5 -5" class="patra-line" />
    <path d="M 5 -5 C 11 -11, 16 -16, 17 -17 C 16 -16, 11 -11, 5 -5" class="patra-line" />
    <path d="M -5 5 C -11 11, -16 16, -17 17 C -16 16, -11 11, -5 5" class="patra-line" />
    <path d="M 5 5 C 11 11, 16 16, 17 17 C 16 16, 11 11, 5 5" class="patra-line" />

    <!-- Petal accents / Cecek dots -->
    <circle cx="0" cy="-14" r="1.2" class="patra-dot" />
    <circle cx="0" cy="14" r="1.2" class="patra-dot" />
    <circle cx="-14" cy="0" r="1.2" class="patra-dot" />
    <circle cx="14" cy="0" r="1.2" class="patra-dot" />
    
    <circle cx="-10" cy="-10" r="1" class="patra-dot" />
    <circle cx="10" cy="-10" r="1" class="patra-dot" />
    <circle cx="-10" cy="10" r="1" class="patra-dot" />
    <circle cx="10" cy="10" r="1" class="patra-dot" />
  </g>

  <!-- Balinese Spiral Tendrils (Patra Punggel / Lung-lungan) to 4 Corners -->
  <!-- Top Left Tendril -->
  <g>
    <path d="M 60 60 C 45 45, 30 55, 24 42 C 18 28, 30 14, 44 20 C 54 24, 52 38, 42 40 C 34 42, 30 34, 34 28" class="patra-line" />
    <path d="M 38 48 C 22 52, 12 40, 14 26" class="patra-line" />
    <circle cx="34" cy="28" r="1.5" class="patra-fill" />
    <circle cx="20" cy="35" r="1" class="patra-dot" />
    <circle cx="26" cy="22" r="1" class="patra-dot" />
    <circle cx="38" cy="18" r="1" class="patra-dot" />
  </g>

  <!-- Top Right Tendril -->
  <g>
    <path d="M 100 60 C 115 45, 130 55, 136 42 C 142 28, 130 14, 116 20 C 106 24, 108 38, 118 40 C 126 42, 130 34, 126 28" class="patra-line" />
    <path d="M 122 48 C 138 52, 148 40, 146 26" class="patra-line" />
    <circle cx="126" cy="28" r="1.5" class="patra-fill" />
    <circle cx="140" cy="35" r="1" class="patra-dot" />
    <circle cx="134" cy="22" r="1" class="patra-dot" />
    <circle cx="122" cy="18" r="1" class="patra-dot" />
  </g>

  <!-- Bottom Left Tendril -->
  <g>
    <path d="M 60 100 C 45 115, 30 105, 24 118 C 18 132, 30 146, 44 140 C 54 136, 52 122, 42 120 C 34 118, 30 126, 34 132" class="patra-line" />
    <path d="M 38 112 C 22 108, 12 120, 14 134" class="patra-line" />
    <circle cx="34" cy="132" r="1.5" class="patra-fill" />
    <circle cx="20" cy="125" r="1" class="patra-dot" />
    <circle cx="26" cy="138" r="1" class="patra-dot" />
    <circle cx="38" cy="142" r="1" class="patra-dot" />
  </g>

  <!-- Bottom Right Tendril -->
  <g>
    <path d="M 100 100 C 115 115, 130 105, 136 118 C 142 132, 130 146, 116 140 C 106 136, 108 122, 118 120 C 126 118, 130 126, 126 132" class="patra-line" />
    <path d="M 122 112 C 138 108, 148 120, 146 134" class="patra-line" />
    <circle cx="126" cy="132" r="1.5" class="patra-fill" />
    <circle cx="140" cy="125" r="1" class="patra-dot" />
    <circle cx="134" cy="138" r="1" class="patra-dot" />
    <circle cx="122" cy="142" r="1" class="patra-dot" />
  </g>

  <!-- Border Repeat Interlocking Florets (Seamless Continuity) -->
  <!-- Top & Bottom border centers -->
  <path d="M 75 0 C 75 6, 85 6, 85 0" class="patra-line" />
  <path d="M 70 0 C 70 10, 90 10, 90 0" class="patra-line" />
  <path d="M 75 160 C 75 154, 85 154, 85 160" class="patra-line" />
  <path d="M 70 160 C 70 150, 90 150, 90 160" class="patra-line" />

  <!-- Left & Right border centers -->
  <path d="M 0 75 C 6 75, 6 85, 0 85" class="patra-line" />
  <path d="M 0 70 C 10 70, 10 90, 0 90" class="patra-line" />
  <path d="M 160 75 C 154 75, 154 85, 160 85" class="patra-line" />
  <path d="M 160 70 C 150 70, 150 90, 160 90" class="patra-line" />

  <!-- Corners: Intersecting Petals -->
  <path d="M 0 15 C 8 10, 10 8, 15 0" class="patra-line" />
  <path d="M 160 15 C 152 10, 150 8, 145 0" class="patra-line" />
  <path d="M 0 145 C 8 150, 10 152, 15 160" class="patra-line" />
  <path d="M 160 145 C 152 150, 150 152, 145 160" class="patra-line" />
</svg>

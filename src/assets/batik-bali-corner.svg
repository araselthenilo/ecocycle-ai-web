<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized Balinese Patra Punggel Carving Ornament -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Main curving ridge -->
    <path d="M 115 5 C 95 6, 75 18, 65 35 C 56 49, 58 68, 72 78 C 84 87, 102 82, 108 68 C 114 54, 102 40, 88 42 C 78 44, 74 54, 78 62 C 82 70, 92 70, 95 64" stroke-width="1.8" />
    
    <!-- Outer decorative scroll leaf -->
    <path d="M 115 25 C 100 26, 88 34, 82 46 C 76 58, 80 72, 92 78" stroke-width="1.2" />
    <path d="M 115 45 C 106 46, 98 52, 95 60" stroke-width="1" />
    
    <!-- Secondary swirl -->
    <path d="M 65 35 C 48 38, 32 50, 26 66 C 20 82, 28 98, 44 104 C 58 109, 74 102, 78 88 C 81 76, 72 66, 60 68 C 50 70, 46 80, 52 88" stroke-width="1.4" />
    
    <!-- Accent leaf tips (Cawangan) -->
    <path d="M 45 42 C 38 35, 28 32, 18 34 C 12 36, 6 42, 5 48 C 12 46, 20 48, 26 54" stroke-width="1.2" />
    <path d="M 28 64 C 18 62, 10 66, 6 74 C 12 73, 18 76, 22 82" stroke-width="1.2" />
    <path d="M 38 102 C 28 106, 22 114, 20 120" stroke-width="1.2" />

    <!-- Cecek dots (traditional batik stippling) -->
    <circle cx="106" cy="16" r="1.5" fill="currentColor" stroke="none" />
    <circle cx="96" cy="22" r="1.5" fill="currentColor" stroke="none" />
    <circle cx="88" cy="30" r="1.5" fill="currentColor" stroke="none" />
    <circle cx="56" cy="42" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="48" cy="50" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="40" cy="62" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="78" cy="62" r="2" fill="currentColor" stroke="none" />
    <circle cx="52" cy="88" r="1.8" fill="currentColor" stroke="none" />
  </g>
</svg>
